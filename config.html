<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>LeGab - Simulado Trimestral</title>
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="css/material.css">
</head>
<body>
    <div class="app-container">
        <header class="md-header">
            <h1 class="md-title">LeGab</h1>
            <nav class="md-nav">
                <a href="index.html" class="md-nav-item">
                    <span class="material-icons">qr_code_scanner</span>
                    <span>Scanner</span>
                </a>
                <a href="generate.html" class="md-nav-item">
                    <span class="material-icons">add_box</span>
                    <span>Gerar</span>
                </a>
                <a href="config.html" class="md-nav-item active">
                    <span class="material-icons">settings</span>
                    <span>Config</span>
                </a>
            </nav>
        </header>

        <main class="md-main">
            <div class="md-card">
                <h2 class="md-card-title">Dados do Gabarito</h2>

                <div class="md-field">
                    <label>Nome da Escola/Instituição</label>
                    <input type="text" id="school-name" class="md-input" placeholder="Ex: Escola Example" maxlength="50">
                </div>

                <div class="md-field">
                    <label>URL do Logo (opcional)</label>
                    <input type="url" id="logo-url" class="md-input" placeholder="https://exemplo.com/logo.png">
                </div>

                <div id="logo-preview" class="logo-preview hidden">
                    <img id="logo-img" src="" alt="Logo">
                </div>
            </div>

            <div class="md-card">
                <h2 class="md-card-title">Configurações</h2>

                <div class="md-row">
                    <div class="md-field">
                        <label>Total de Questões</label>
                        <input type="number" id="num-questions" class="md-input" min="1" max="200" value="6">
                    </div>
                    <div class="md-field">
                        <label>Alternativas</label>
                        <select id="num-alternatives" class="md-select">
                            <option value="3">3 (A, B, C)</option>
                            <option value="4">4 (A, B, C, D)</option>
                            <option value="5" selected>5 (A, B, C, D, E)</option>
                        </select>
                    </div>
                </div>

                <div class="md-row">
                    <div class="md-field">
                        <label>Coluna Esquerda</label>
                        <input type="number" id="left-column" class="md-input" min="1" max="100" value="3">
                    </div>
                    <div class="md-field">
                        <label>Coluna Direita</label>
                        <input type="number" id="right-column" class="md-input" min="1" max="100" value="3">
                    </div>
                </div>

                <div class="md-field">
                    <label>Nota de Aprovação (%)</label>
                    <input type="number" id="passing-score" class="md-input" min="0" max="100" value="60">
                </div>
            </div>

            <div class="md-card">
                <h2 class="md-card-title">Criar Gabarito</h2>
                <p class="md-hint">Clique nas alternativas para criar as respostas</p>

                <div class="answer-builder">
                    <div class="answer-header">
                        <span class="answer-num">Q</span>
                        <div class="answer-alts" id="alt-labels"></div>
                    </div>
                    <div id="answer-rows" class="answer-rows"></div>
                </div>

                <div class="md-field" style="margin-top: 16px;">
                    <label>Gabarito Gerado</label>
                    <div class="gabarito-preview">
                        <input type="text" id="correct-answers" class="md-input gabarito-input" readonly>
                        <span id="answers-counter" class="md-counter">0/65</span>
                    </div>
                </div>

                <div class="md-actions">
                    <button id="btn-clear" class="md-btn md-btn-outline">
                        <span class="material-icons">clear</span>
                        Limpar
                    </button>
                    <button id="btn-random" class="md-btn md-btn-outline">
                        <span class="material-icons">shuffle</span>
                        Aleatório
                    </button>
                </div>
            </div>

            <div class="md-card">
                <div class="md-actions">
                    <button id="btn-save-config" class="md-btn md-btn-primary">
                        <span class="material-icons">save</span>
                        Salvar
                    </button>
                    <button id="btn-load-config" class="md-btn md-btn-secondary">
                        <span class="material-icons">cloud_download</span>
                        Carregar
                    </button>
                </div>
                <p id="config-status" class="config-status">Status: Conectando...</p>
            </div>

            <div class="md-card">
                <h3 class="md-card-subtitle">Configuração Atual</h3>
                <div id="current-config" class="config-info">
                    <p>Escola: <strong id="display-school">-</strong></p>
                    <p>Questões: <strong id="display-questions">-</strong></p>
                    <p>Alternativas: <strong id="display-alternatives">-</strong></p>
                    <p>Colunas: <strong id="display-columns">-</strong></p>
                    <p>Aprovação: <strong id="display-passing">-</strong>%</p>
                </div>
            </div>
        </main>
    </div>

    <div id="toast" class="md-toast"></div>

    <script src="js/config.js"></script>
    <script src="js/config-ui.js"></script>
</body>
</html>
