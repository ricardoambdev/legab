<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>LeGab - Gerar Gabarito</title>
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="css/material.css">
    <link rel="stylesheet" href="css/gabarito.css">
</head>
<body>
    <div class="app-container">
        <header class="md-header">
            <h1 class="md-title">LeGab</h1>
            <nav class="md-nav">
                <a href="index.html" class="md-nav-item">
                    <span class="material-icons">qr_code_scanner</span>
                    <span>Scanner</span>
                </a>
                <a href="generate.html" class="md-nav-item active">
                    <span class="material-icons">add_box</span>
                    <span>Gerar</span>
                </a>
                <a href="config.html" class="md-nav-item">
                    <span class="material-icons">settings</span>
                    <span>Config</span>
                </a>
            </nav>
        </header>

        <main class="md-main">
            <div id="no-config-msg" class="md-card hidden">
                <div class="empty-state">
                    <span class="material-icons">info</span>
                    <p>Configure o gabarito primeiro</p>
                    <a href="config.html" class="md-btn md-btn-primary">
                        <span class="material-icons">settings</span>
                        Ir para Config
                    </a>
                </div>
            </div>

            <div id="generate-section">
                <div class="md-card config-summary">
                    <div class="config-item">
                        <span class="material-icons">help_outline</span>
                        <div>
                            <strong id="summary-questions">-</strong>
                            <small>Questões</small>
                        </div>
                    </div>
                    <div class="config-item">
                        <span class="material-icons">view_column</span>
                        <div>
                            <strong id="summary-columns">-</strong>
                            <small>Colunas</small>
                        </div>
                    </div>
                    <div class="config-item">
                        <span class="material-icons">list</span>
                        <div>
                            <strong id="summary-alts">-</strong>
                            <small>Alternativas</small>
                        </div>
                    </div>
                </div>

                <div class="md-card">
                    <h2 class="md-card-title">Criar Gabarito</h2>
                    <p class="md-hint">Clique nas alternativas para criar as respostas</p>

                    <div class="answer-builder">
                        <div class="answer-header">
                            <span class="answer-num">Q</span>
                            <div class="answer-alts" id="alt-labels"></div>
                        </div>
                        <div id="answer-rows" class="answer-rows"></div>
                    </div>

                    <div class="md-field" style="margin-top: 16px;">
                        <label>Gabarito</label>
                        <div class="gabarito-preview">
                            <input type="text" id="gen-answers" class="md-input gabarito-input" readonly>
                            <span id="gen-counter" class="md-counter">0/65</span>
                        </div>
                    </div>

                    <div class="md-actions">
                        <button id="btn-clear" class="md-btn md-btn-outline">
                            <span class="material-icons">clear</span>
                            Limpar
                        </button>
                        <button id="btn-random" class="md-btn md-btn-outline">
                            <span class="material-icons">shuffle</span>
                            Aleatório
                        </button>
                    </div>
                </div>

                <div class="md-card">
                    <button id="btn-generate" class="md-btn md-btn-primary" style="width: 100%;">
                        <span class="material-icons">print</span>
                        Gerar Gabarito para Impressão
                    </button>
                </div>

                <div id="gabarito-preview" class="md-card hidden">
                    <div class="preview-toolbar">
                        <button id="btn-copy" class="md-btn md-btn-outline">
                            <span class="material-icons">content_copy</span>
                            Copiar
                        </button>
                        <button id="btn-show-key" class="md-btn md-btn-outline">
                            <span class="material-icons">visibility</span>
                            Ver Chave
                        </button>
                        <button id="btn-print" class="md-btn md-btn-primary">
                            <span class="material-icons">print</span>
                            Imprimir
                        </button>
                    </div>
                    <div id="gabarito-pages" class="gabarito-pages"></div>
                </div>

                <div id="qr-section" class="md-card hidden">
                    <h3 class="md-card-subtitle">QR Code</h3>
                    <div id="qrcode-container" class="qrcode-container"></div>
                </div>
            </div>
        </main>
    </div>

    <div id="toast" class="md-toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/generate-ui.js"></script>
</body>
</html>
