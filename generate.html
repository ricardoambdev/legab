<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LeGab - Gerar Folhas</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
  <header class="header no-print">
    <div class="header-brand">
      <span class="material-icons">print</span>
      <span>LeGab</span>
    </div>
    <nav class="header-nav">
      <a href="index.html"><span class="material-icons">qr_code_scanner</span></a>
      <a href="generate.html" class="active"><span class="material-icons">print</span></a>
      <a href="settings.html"><span class="material-icons">settings</span></a>
      <a href="dashboard.html"><span class="material-icons">assessment</span></a>
    </nav>
  </header>

  <main class="container">
    <div class="card">
      <div class="card-title">
        <span class="material-icons">description</span>
        Gerar Folha de Respostas
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Questões</label>
          <input type="number" id="questions" class="form-input" value="60" min="1" max="120">
        </div>
        <div class="form-group">
          <label class="form-label">Alternativas</label>
          <select id="alternatives" class="form-select">
            <option value="5">5 (A-E)</option>
            <option value="4">4 (A-D)</option>
            <option value="3">3 (A-C)</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Título</label>
          <input type="text" id="title" class="form-input" value="Simulado Trimestral">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Gabarito (opcional - p/ folha preenchida)</label>
        <input type="text" id="key" class="form-input" placeholder="Ex: ABCDEABCDE... (uma letra por questão)" maxlength="120" style="font-family:monospace;letter-spacing:4px">
      </div>

      <div class="btn-group mt-16">
        <button class="btn btn-primary" onclick="generateBlank()">
          <span class="material-icons">file_open</span>
          Folha Vazia
        </button>
        <button class="btn btn-outline" onclick="generateFilled()">
          <span class="material-icons">check_circle</span>
          Gabarito Preenchido
        </button>
        <button class="btn btn-outline" onclick="downloadSheet()">
          <span class="material-icons">download</span>
          Baixar PDF
        </button>
      </div>
    </div>

    <div class="text-center" style="color:#999;font-size:13px">
      O gabarito deve ter uma letra por questão (ex: ABCDE...)<br>
      Salve também em Settings para o scanner corrigir automaticamente.
    </div>
  </main>

  <script src="js/firebase.js"></script>
  <script src="js/generator.js"></script>
  <script>
    let lastDoc = null;

    function getConfig() {
      return {
        questions: parseInt(document.getElementById('questions').value) || 60,
        alternatives: parseInt(document.getElementById('alternatives').value) || 5,
        title: document.getElementById('title').value || 'Simulado',
        key: document.getElementById('key').value || ''
      };
    }

    function buildAnswers(key, questions) {
      const answers = {};
      for (let i = 0; i < Math.min(key.length, questions); i++) {
        answers[i + 1] = key[i].toUpperCase();
      }
      return answers;
    }

    function generateBlank() {
      const { questions, alternatives, title } = getConfig();
      lastDoc = SheetGenerator.generate(questions, alternatives, {});
      lastDoc.save('folha-respostas-vazia.pdf');
    }

    function generateFilled() {
      const { questions, alternatives, title, key } = getConfig();
      const answers = buildAnswers(key, questions);
      lastDoc = SheetGenerator.generate(questions, alternatives, answers);
      lastDoc.save('gabarito-preenchido.pdf');

      // Salva gabarito automaticamente
      Firebase.init().then(() => {
        Firebase.saveConfig({ questions, alternatives, title, answers });
      });
    }

    async function downloadSheet() {
      await Firebase.init();
      const config = await Firebase.loadConfig();

      const answers = config.answers || {};
      lastDoc = SheetGenerator.generate(
        config.questions || 60,
        config.alternatives || 5,
        answers
      );
      const name = (Object.keys(answers).length > 0) ? 'gabarito-preenchido' : 'folha-respostas-vazia';
      lastDoc.save(name + '.pdf');
    }

    Firebase.init();
  </script>
</body>
</html>
