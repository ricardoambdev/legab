<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>LeGab - Gerar Gabarito</title>
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="css/material.css">
</head>
<body>
    <div class="app-container">
        <header class="md-header">
            <h1 class="md-title">LeGab</h1>
            <nav class="md-nav">
                <a href="index.html" class="md-nav-item">
                    <span class="material-icons">qr_code_scanner</span>
                    <span>Scanner</span>
                </a>
                <a href="generate.html" class="md-nav-item active">
                    <span class="material-icons">add_box</span>
                    <span>Gerar</span>
                </a>
                <a href="config.html" class="md-nav-item">
                    <span class="material-icons">settings</span>
                    <span>Config</span>
                </a>
            </nav>
        </header>

        <main class="md-main">
            <div class="md-card">
                <h2 class="md-card-title">Simulado Trimestral</h2>
                <p class="md-hint">Selecione o tipo de gabarito para impressão</p>

                <div class="generate-options">
                    <button id="btn-generate-blank" class="generate-btn">
                        <span class="material-icons">description</span>
                        <strong>Gabarito em Branco</strong>
                        <small>Para o aluno preencher</small>
                    </button>

                    <button id="btn-generate-key" class="generate-btn">
                        <span class="material-icons">check_circle</span>
                        <strong>Gabarito com Respostas</strong>
                        <small>Para correção</small>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <div id="toast" class="md-toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <script>
        let currentConfig = null;

        document.addEventListener('DOMContentLoaded', async () => {
            const btnGenerateBlank = document.getElementById('btn-generate-blank');
            const btnGenerateKey = document.getElementById('btn-generate-key');

            function showToast(message, isError = false) {
                const toast = document.getElementById('toast');
                toast.textContent = message;
                toast.className = `md-toast ${isError ? 'error' : 'success'} show`;
                setTimeout(() => toast.classList.remove('show'), 3000);
            }

            function loadConfig() {
                try {
                    const stored = localStorage.getItem('legab_config');
                    if (stored) {
                        currentConfig = JSON.parse(stored);
                    }
                } catch (e) {
                    console.error('Erro:', e);
                }
            }

            function openPrintWindow(answers) {
                if (!currentConfig) {
                    showToast('Configure o gabarito primeiro!', true);
                    return;
                }

                const numQuestions = currentConfig.numQuestions || 65;
                const numAlternatives = currentConfig.numAlternatives || 5;
                const leftColumn = currentConfig.leftColumn || 33;
                const rightColumn = currentConfig.rightColumn || 32;
                const schoolName = currentConfig.schoolName || 'Simulado Trimestral';
                const logoUrl = currentConfig.logoUrl || '';
                const showAnswers = answers && answers.length > 0;
                const opts = 'ABCDE'.substring(0, numAlternatives);

                const questionsPerPage = leftColumn + rightColumn;
                const totalPages = Math.ceil(numQuestions / questionsPerPage);

                let pagesHTML = '';

                for (let page = 0; page < totalPages; page++) {
                    const startQ = page * questionsPerPage + 1;
                    const endQ = Math.min(startQ + questionsPerPage - 1, numQuestions);
                    const rowsOnPage = leftColumn;

                    let tableRows = '';
                    for (let row = 0; row < rowsOnPage; row++) {
                        const q1 = startQ + row;
                        const q2 = startQ + row + leftColumn;

                        tableRows += '<tr>';

                        if (q1 >= startQ && q1 <= Math.min(startQ + leftColumn - 1, numQuestions)) {
                            tableRows += `<td class="q">${q1}</td>`;
                            for (let alt = 0; alt < numAlternatives; alt++) {
                                const letter = opts[alt];
                                const filled = showAnswers && answers[q1 - 1] === letter;
                                tableRows += `<td class="b"><div class="bolha${filled ? ' resp' : ''}">${letter}</div></td>`;
                            }
                        } else {
                            tableRows += '<td class="q"></td>';
                            for (let alt = 0; alt < numAlternatives; alt++) {
                                tableRows += '<td class="b"></td>';
                            }
                        }

                        tableRows += '<td class="sep"></td>';

                        if (q2 >= startQ + leftColumn && q2 <= numQuestions) {
                            tableRows += `<td class="q">${q2}</td>`;
                            for (let alt = 0; alt < numAlternatives; alt++) {
                                const letter = opts[alt];
                                const filled = showAnswers && answers[q2 - 1] === letter;
                                tableRows += `<td class="b"><div class="bolha${filled ? ' resp' : ''}">${letter}</div></td>`;
                            }
                        } else {
                            tableRows += '<td class="q"></td>';
                            for (let alt = 0; alt < numAlternatives; alt++) {
                                tableRows += '<td class="b"></td>';
                            }
                        }

                        tableRows += '</tr>';
                    }

                    const hCol = `<th class="q">Q</th>` + opts.split('').map(a => `<th class="h">${a}</th>`).join('') + `<th class="sep"></th><th class="q">Q</th>` + opts.split('').map(a => `<th class="h">${a}</th>`).join('');

                    let logoHTML = logoUrl ? `<img src="${logoUrl}" class="logo">` : '';

                    pagesHTML += `
                        <div class="folha">
                            <div class="topo">
                                <div class="logo-titulo">
                                    ${logoHTML}
                                    <div class="titulo">
                                        <h1>${schoolName}</h1>
                                        <p>Simulado Trimestral - Folha de Respostas</p>
                                    </div>
                                </div>
                                ${showAnswers ? '<div class="badge-gab">GABARITO</div>' : ''}
                            </div>
                            <div class="campos">
                                <div class="campo">
                                    <span class="label">Nome do Aluno:</span>
                                    <div class="linha-campo"></div>
                                </div>
                                <div class="campo curto">
                                    <span class="label">Turma/Série:</span>
                                    <div class="linha-campo"></div>
                                </div>
                                <div class="campo">
                                    <span class="label">Data:</span>
                                    <div class="linha-campo data">__ / __ / ____</div>
                                </div>
                            </div>
                            <table class="tabela">
                                <thead><tr>${hCol}</tr></thead>
                                <tbody>${tableRows}</tbody>
                            </table>
                            <div class="rodape">
                                Questões ${startQ} a ${endQ} de ${numQuestions} | ${schoolName}
                            </div>
                        </div>
                    `;
                }

                const printWindow = window.open('', '_blank');
                printWindow.document.write(`<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>${schoolName} - Gabarito</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Roboto', sans-serif; background: #fff; }

        .folha {
            width: 210mm;
            min-height: 297mm;
            padding: 15mm 18mm;
            margin: 0 auto;
            background: #fff;
            border: 3px solid #FF6D00;
            position: relative;
        }

        .topo {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding-bottom: 12px;
            margin-bottom: 15px;
            border-bottom: 2px solid #FF6D00;
        }

        .logo-titulo {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo {
            height: 60px;
            max-width: 120px;
        }

        .titulo h1 {
            color: #FF6D00;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .titulo p {
            color: #333;
            font-size: 13px;
            font-weight: 500;
        }

        .badge-gab {
            background: #FF6D00;
            color: #fff;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 700;
            border-radius: 6px;
        }

        .campos {
            display: flex;
            gap: 25px;
            margin-bottom: 20px;
            padding: 12px;
            background: #FFF8F4;
            border-radius: 8px;
        }

        .campo {
            flex: 1;
        }

        .campo.curto {
            max-width: 110px;
            flex: none;
        }

        .campo .label {
            font-size: 11px;
            color: #666;
            text-transform: uppercase;
            display: block;
            margin-bottom: 5px;
        }

        .linha-campo {
            height: 24px;
            border-bottom: 1.5px solid #333;
        }

        .linha-campo.data {
            border: none;
            font-size: 14px;
            letter-spacing: 3px;
            padding: 2px 0;
        }

        .tabela {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
        }

        .tabela th, .tabela td {
            border: 1.5px solid #333;
            padding: 0;
            text-align: center;
            vertical-align: middle;
        }

        .tabela th {
            background: #FF6D00;
            color: #fff;
            font-weight: 600;
            padding: 6px 4px;
        }

        .tabela .q {
            background: #FFF3E0;
            font-weight: 700;
            width: 32px;
            font-size: 10px;
        }

        .tabela .h {
            width: 30px;
            font-weight: 700;
        }

        .tabela .sep {
            width: 8px;
            background: #eee;
            border: none;
        }

        .tabela .b {
            padding: 4px;
        }

        .bolha {
            width: 24px;
            height: 24px;
            border: 2px solid #333;
            border-radius: 4px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 11px;
            background: #fff;
        }

        .bolha.resp {
            background: #FF6D00;
            border-color: #E65100;
            color: #fff;
        }

        .tabela tbody tr:nth-child(even) {
            background: #FFF8F4;
        }

        .rodape {
            position: absolute;
            bottom: 10mm;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 10px;
            color: #888;
            padding-top: 8px;
            border-top: 1px solid #ddd;
        }

        @media print {
            body { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
            .folha { border: none; }
        }

        @page { size: A4; margin: 0; }
    </style>
</head>
<body>
    ${pagesHTML}
</body>
</html>`);
                printWindow.document.close();
                printWindow.focus();
                return printWindow;
            }

            btnGenerateBlank.addEventListener('click', () => {
                loadConfig();
                if (!currentConfig) {
                    showToast('Configure o gabarito primeiro!', true);
                    return;
                }
                openPrintWindow('');
                showToast('Gabarito aberto para impressão!');
            });

            btnGenerateKey.addEventListener('click', () => {
                loadConfig();
                if (!currentConfig) {
                    showToast('Configure o gabarito primeiro!', true);
                    return;
                }
                if (!currentConfig.correctAnswers) {
                    showToast('Crie o gabarito em Config!', true);
                    return;
                }
                openPrintWindow(currentConfig.correctAnswers);
                showToast('Gabarito com respostas aberto!');
            });

            loadConfig();
        });
    </script>
</body>
</html>
