<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeGab - Gerar Folha de Respostas</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:w800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="css/material.css">
    <style>
        .generate-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
        }
        
        .options-card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .actions {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }
        
        .actions button {
            flex: 1;
        }
        
        .print-container {
            display: none;
            background: white;
            width: 210mm;
            min-height: 297mm;
            margin: 0 auto 24px;
            padding: 15mm;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15);
        }
        
        @media print {
            .no-print { display: none !important; }
            .print-container { 
                display: block !important;
                margin: 0;
                padding: 15mm;
            }
        }
    </style>
</head>
<body>
    <header class="md-header no-print">
        <div class="header-content">
            <div class="logo">
                <span class="material-icons">add_box</span>
                <h1>LeGab</h1>
            </div>
            <nav class="md-nav">
                <a href="index.html" data-tooltip="Scanner">
                    <span class="material-icons">qr_code_scanner</span>
                </a>
                <a href="generate.html" class="active" data-tooltip="Gerar">
                    <span class="material-icons">add_box</span>
                </a>
                <a href="config.html" data-tooltip="Config">
                    <span class="material-icons">settings</span>
                </a>
            </nav>
        </div>
    </header>

    <main class="md-main">
        <div class="generate-container">
            <div class="options-card">
                <h3>
                    <span class="material-icons">settings</span>
                    Gerar Folha de Respostas
                </h3>
                
                <div class="form-row">
                    <div class="md-field">
                        <label>Nome da Prova</label>
                        <input type="text" id="exam-title" value="Prova 01">
                    </div>
                    <div class="md-field">
                        <label>Número de Questões</label>
                        <input type="number" id="num-questions" value="60" min="1" max="100">
                    </div>
                    <div class="md-field">
                        <label>Alternativas</label>
                        <select id="num-alternatives">
                            <option value="5">5 (A-E)</option>
                            <option value="4">4 (A-D)</option>
                        </select>
                    </div>
                </div>
                
                <div class="actions">
                    <button class="md-btn md-btn-primary" onclick="generateSheet('blank')">
                        <span class="material-icons">picture_as_pdf</span>
                        Gerar Folha Vazia
                    </button>
                    <button class="md-btn md-btn-outline" onclick="generateSheet('filled')">
                        <span class="material-icons">print</span>
                        Gerar Folha Preenchida
                    </button>
                    <button class="md-btn md-btn-outline" onclick="downloadPDF()">
                        <span class="material-icons">download</span>
                        Baixar PDF
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script>
        function generateSheet(type) {
            // Gera a folha de respostas
            if (type === 'blank') {
                // Gera folha vazia
                generateAnswerSheet(false);
            } else {
                // Gera folha preenchida
                generateAnswerSheet(true);
            }
        }
        
        function generateAnswerSheet(filled) {
            // Função para gerar a folha de respostas
            // Implementação do PDF ou folha aqui
        }
        
        function downloadPDF() {
            // Função para baixar PDF
        }
    </script>
</body>
</html>
