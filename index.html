<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#FF6D00">
  <title>LeGab - Scanner OMR</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <header class="header">
    <div class="header-brand">
      <span class="material-icons">qr_code_scanner</span>
      <span>LeGab</span>
    </div>
    <nav class="header-nav">
      <a href="index.html" class="active"><span class="material-icons">qr_code_scanner</span></a>
      <a href="generate.html"><span class="material-icons">print</span></a>
      <a href="settings.html"><span class="material-icons">settings</span></a>
      <a href="dashboard.html"><span class="material-icons">assessment</span></a>
    </nav>
  </header>

  <main class="container">
    <div class="camera-wrapper">
      <video id="video" autoplay playsinline muted></video>
      <div class="camera-overlay">
        <div class="scan-area"></div>
      </div>
      <div class="camera-controls">
        <button class="capture-btn" onclick="captureAndProcess()" id="capture-btn">
          <span class="material-icons">photo_camera</span>
        </button>
      </div>
    </div>

    <div id="status" class="status-bar info mt-16" style="display:none;"></div>
    <div class="text-center mt-16" style="color:#999;font-size:13px">
      Enquadre o gabarito e toque no botão para capturar
    </div>
  </main>

  <script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="onOpenCVReady()"></script>
  <script src="js/firebase.js"></script>
  <script src="js/omr/camera.js"></script>
  <script src="js/omr/preprocessing.js"></script>
  <script src="js/omr/perspective.js"></script>
  <script src="js/omr/omr.js"></script>
  <script src="js/omr/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
