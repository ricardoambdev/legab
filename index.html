<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>LeGab - Scanner</title>
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="css/material.css">
</head>
<body>
    <div class="app-container">
        <header class="md-header">
            <h1 class="md-title">LeGab</h1>
            <nav class="md-nav">
                <a href="index.html" class="md-nav-item active">
                    <span class="material-icons">qr_code_scanner</span>
                    <span>Scanner</span>
                </a>
                <a href="generate.html" class="md-nav-item">
                    <span class="material-icons">add_box</span>
                    <span>Gerar</span>
                </a>
                <a href="config.html" class="md-nav-item">
                    <span class="material-icons">settings</span>
                    <span>Config</span>
                </a>
            </nav>
        </header>

        <main class="md-main">
            <div class="md-card">
                <h2 class="md-card-title">Escanear Gabarito</h2>

                <div class="scanner-container">
                    <video id="video" class="scanner-video" autoplay playsinline></video>
                    <canvas id="canvas" class="scanner-canvas"></canvas>
                    <div id="scanner-overlay" class="scanner-overlay">
                        <div class="scanner-frame"></div>
                    </div>
                </div>

                <div class="scanner-controls">
                    <button id="btn-start" class="md-btn md-btn-primary">
                        <span class="material-icons">camera_alt</span>
                        Iniciar Câmera
                    </button>
                    <button id="btn-capture" class="md-btn md-btn-primary hidden">
                        <span class="material-icons">photo_camera</span>
                        Capturar
                    </button>
                    <button id="btn-stop" class="md-btn md-btn-outline hidden">
                        <span class="material-icons">stop</span>
                        Parar
                    </button>
                </div>
            </div>

            <div id="debug-section" class="md-card hidden">
                <h3 class="md-card-subtitle">Debug</h3>
                <div id="debug-log" class="debug-log"></div>
            </div>

            <div class="md-card">
                <h3 class="md-card-title">Ou digite as respostas</h3>
                <div class="md-field">
                    <label>Respostas (ex: ABCDED...)</label>
                    <input type="text" id="manual-answers" class="md-input" placeholder="Digite as respostas..." maxlength="65">
                </div>
                <button id="btn-check" class="md-btn md-btn-primary" style="width: 100%;">
                    <span class="material-icons">check</span>
                    Verificar
                </button>
            </div>

            <div id="result-section" class="md-card hidden">
                <div class="result-card">
                    <h2 class="result-title">Resultado</h2>
                    <div class="result-stats">
                        <div class="stat correct">
                            <span class="stat-value" id="correct-count">0</span>
                            <span class="stat-label">Acertos</span>
                        </div>
                        <div class="stat wrong">
                            <span class="stat-value" id="wrong-count">0</span>
                            <span class="stat-label">Erros</span>
                        </div>
                        <div class="stat blank">
                            <span class="stat-value" id="blank-count">0</span>
                            <span class="stat-label">Brancas</span>
                        </div>
                    </div>
                    <div class="result-score">
                        <span class="score-value" id="score-percent">0%</span>
                    </div>
                    <div id="pass-fail" class="pass-fail"></div>
                </div>
            </div>

            <div id="loading-section" class="md-card hidden">
                <div class="loading">
                    <div class="md-spinner"></div>
                    <p id="loading-status">Processando...</p>
                </div>
            </div>

            <div class="md-card config-mini">
                <p>Questões: <strong id="config-questions">-</strong> |
                   Alternativas: <strong id="config-alternatives">-</strong></p>
                <div id="debug-status" class="debug-status"></div>
            </div>
        </main>
    </div>

    <div id="toast" class="md-toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/scanner-ui.js"></script>
</body>
</html>
